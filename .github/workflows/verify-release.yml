name: Verify live release

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-release
  cancel-in-progress: true

jobs:
  verify:
    # Only run code from this repository's current main deployment. Old deployments
    # may finish after a newer commit has already superseded them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    # Keep the OS compatible with the pinned Playwright 1.57 browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            install: --only-shell chromium
          - browser: firefox
            install: firefox
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.install }}
      - name: Verify deployed files and browser behavior
        run: npm run verify:release
        env:
          RELEASE_BASE_URL: https://xellarant.github.io/AuroraXMLHelper/
          AURORA_BROWSER: ${{ matrix.browser }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SMOKE_REPORT_DIR: artifacts/release
      - name: Keep release verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ matrix.browser }}
          path: artifacts/release
          if-no-files-found: ignore
          retention-days: 14
