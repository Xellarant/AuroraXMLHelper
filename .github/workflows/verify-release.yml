name: Verify live release

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-release
  cancel-in-progress: true

jobs:
  verify:
    # Only run code from this repository's current main deployment. Old deployments
    # may finish after a newer commit has already superseded them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify deployed files and browser behavior
        run: npm run verify:release
        env:
          RELEASE_BASE_URL: https://xellarant.github.io/AuroraXMLHelper/
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SMOKE_REPORT_DIR: artifacts/release
      - name: Keep release verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: artifacts/release
          if-no-files-found: ignore
          retention-days: 14
